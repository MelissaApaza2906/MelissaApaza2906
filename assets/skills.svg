<div class="mono" style="position:absolute;inset:12px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:linear-gradient(135deg,#a2399f,#4a1650);display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;color:#f5f3ff">JS</div></div>
<div style="font-size:17px;font-weight:600;color:#f5f3ff">JavaScript</div>
