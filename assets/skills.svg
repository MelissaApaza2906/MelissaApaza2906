<div class="mono" style="font-size:10px;letter-spacing:1px;color:#a39bbd">VISTO EN</div>
<div class="mono" style="font-size:11px;color:#a78bfa;line-height:1.4">Escaneo_de_Plantas</div></div></div><div class="cut-s lit" style="padding:1px;background:linear-gradient(160deg,#c4b5fd,#2a1a47);animation-delay:4s"><div class="cut-s" style="background:#0b0714;padding:18px 14px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;height:100%">
<div style="position:relative;width:78px;height:78px"><svg xmlns="http://www.w3.org/2000/svg" class="hex" width="78" height="78" viewBox="0 0 78 78" fill="none" style="position:absolute;inset:0"><path d="M39 3l31 18v36L39 75 8 57V21z" stroke="#c4b5fd" stroke-width="1.4" stroke-dasharray="4 6"/></svg>
<div class="mono" style="position:absolute;inset:12px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:linear-gradient(135deg,#5b3fa8,#2a1a47);display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;color:#f5f3ff">&lt;/&gt;</div></div>
<div style="font-size:17px;font-weight:600;color:#f5f3ff">HTML</div>
<div class="mono" style="font-size:10px;letter-spacing:1px;color:#a39bbd">VISTO EN</div>
