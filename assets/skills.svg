<div style="position:relative;width:78px;height:78px"><svg xmlns="http://www.w3.org/2000/svg" class="hex" width="78" height="78" viewBox="0 0 78 78" fill="none" style="position:absolute;inset:0"><path d="M39 3l31 18v36L39 75 8 57V21z" stroke="#e879f9" stroke-width="1.4" stroke-dasharray="4 6"/></svg>
<div class="mono" style="position:absolute;inset:12px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:linear-gradient(135deg,#8b2f9a,#3b1450);display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;color:#f5f3ff">{ }</div></div>
<div style="font-size:17px;font-weight:600;color:#f5f3ff">CSS</div>
<div class="mono" style="font-size:10px;letter-spacing:1px;color:#a39bbd">VISTO EN</div>
<div class="mono" style="font-size:11px;color:#e879f9;line-height:1.4">SECRET_FRIEND</div></div></div></div>
