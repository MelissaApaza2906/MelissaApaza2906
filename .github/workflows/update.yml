name: Actualizar perfil
on:
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:
  push:
    paths: ["scripts/**"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save --no-package-lock sharp@0.33.5
      - run: node scripts/generate.mjs
        env:
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
          GH_USER: MelissaApaza2906
      - run: |
          git config user.name "profile-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets README.md
          git commit -m "chore: actualizar perfil" || echo "sin cambios"
          git push
